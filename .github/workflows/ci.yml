name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the plugin manifests and setup skill match package.json's version
        run: node scripts/sync-plugin-version.js --check

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install ruff
        # tests/test_python_stack.sh runs the detected lint and format commands with the real tool.
        run: pipx install ruff

      - name: Install deno
        # tests/test_python_stack.sh also runs the detected deno lint and format commands for real.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test
        run: npm test

      - name: Verify CLI
        run: node dist/cli.js --version

      - name: Validate Claude Code plugin and marketplace
        run: |
          # Pinned so new validator rules can't turn unrelated PRs red; bump on purpose.
          npm install -g @anthropic-ai/claude-code@2.1.319
          claude plugin validate .
          claude plugin validate plugins/code-evolve

  guard-macos:
    # The protected-path guard is bash, find, readlink and cp: the parts that differ between GNU
    # and BSD userlands. macOS also brings bash 3.2.
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Protected-path guard test with the system bash and find
        run: |
          # Recorded in the log: which bash and find the engine got.
          command -v bash find
          bash --version | head -1
          find --version 2>/dev/null | grep -m1 . || echo "find has no --version (BSD find)"
          bash tests/test_protected_paths.sh
