# code-evolve:managed — installed by `code-evolve init --with-ci`, removed by `code-evolve eject`. Safe to delete.
name: Evolution

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Non-secret config is shared at job scope. AGENT/MODEL are templated by
    # `code-evolve init` for the configured agent (values below are the Claude
    # defaults). Secrets are deliberately NOT here — they're scoped to the steps
    # that need them so third-party setup actions never see them.
    env:
      AGENT: claude
      MODEL: claude-sonnet-4-6
      REPO: ${{ github.repository }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
      EVOLVE_DIR: .evolve

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # evolve.sh builds/tests the project, so its toolchains must be present too.
      - name: Detect stack toolchains
        id: detect
        run: |
          chmod +x .evolve/scripts/detect_stack.sh
          STACK_JSON=$(bash .evolve/scripts/detect_stack.sh . 2>/dev/null || echo '{"stack":"unknown"}')
          STACKS=$(echo "$STACK_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join([d.get('stack','')] + [s.get('stack','') for s in d.get('substacks',[])]))")
          echo "Detected stacks: $STACKS"
          case " $STACKS " in *" rust "*) echo "needs_rust=true" >> "$GITHUB_OUTPUT";; esac
          case " $STACKS " in *" go "*) echo "needs_go=true" >> "$GITHUB_OUTPUT";; esac
          # ponytail: java/kotlin not yet emitted by detect_stack.sh (see #28); inert until then.
          case " $STACKS " in *" java "*|*" kotlin "*) echo "needs_java=true" >> "$GITHUB_OUTPUT";; esac

      - name: Setup Rust
        if: steps.detect.outputs.needs_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: steps.detect.outputs.needs_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java
        if: steps.detect.outputs.needs_java == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install agent CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "code-evolve[bot]"
          git config user.email "code-evolve[bot]@users.noreply.github.com"

      - name: Run evolution session
        id: attempt1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # code-evolve:secrets — agent backend secrets (templated by init)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_AUTH_MODE: api-key
          # code-evolve:secrets-end
        run: |
          chmod +x .evolve/scripts/evolve.sh
          .evolve/scripts/evolve.sh

      - name: Retry after 15min
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # code-evolve:secrets — agent backend secrets (templated by init)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_AUTH_MODE: api-key
          # code-evolve:secrets-end
        run: |
          echo "Waiting 15 minutes before retry..."
          sleep 900
          .evolve/scripts/evolve.sh

      - name: Retry after 45min
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # code-evolve:secrets — agent backend secrets (templated by init)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_AUTH_MODE: api-key
          # code-evolve:secrets-end
        run: |
          echo "Waiting 45 minutes before retry..."
          sleep 2700
          .evolve/scripts/evolve.sh
