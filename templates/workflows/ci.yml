# code-evolve:managed — installed by `code-evolve init --with-ci`, removed by `code-evolve eject`. Safe to delete.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Detect the stack(s) up front so toolchain setup actions below can gate on it.
      # Node/Python/uv are always provisioned above; this covers the compiled stacks.
      - name: Detect stack toolchains
        id: detect
        run: |
          chmod +x .evolve/scripts/detect_stack.sh
          STACK_JSON=$(bash .evolve/scripts/detect_stack.sh . 2>/dev/null || echo '{"stack":"unknown"}')
          # Flatten single-stack + every monorepo substack into one space-padded list.
          STACKS=$(echo "$STACK_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join([d.get('stack','')] + [s.get('stack','') for s in d.get('substacks',[])]))")
          echo "Detected stacks: $STACKS"
          case " $STACKS " in *" rust "*) echo "needs_rust=true" >> "$GITHUB_OUTPUT";; esac
          case " $STACKS " in *" go "*) echo "needs_go=true" >> "$GITHUB_OUTPUT";; esac
          # ponytail: java/kotlin not yet emitted by detect_stack.sh (see #28); inert until then.
          case " $STACKS " in *" java "*|*" kotlin "*) echo "needs_java=true" >> "$GITHUB_OUTPUT";; esac

      - name: Setup Rust
        if: steps.detect.outputs.needs_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: steps.detect.outputs.needs_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java
        if: steps.detect.outputs.needs_java == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect and verify project
        run: |
          chmod +x .evolve/scripts/detect_stack.sh
          STACK_JSON=$(bash .evolve/scripts/detect_stack.sh . 2>/dev/null || echo '{"stack":"unknown"}')
          STACK=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['stack'])")
          echo "Detected stack: $STACK"

          if [ "$STACK" = "unknown" ]; then
            echo "No project stack detected yet — skipping build verification."
            exit 0
          fi

          if [ "$STACK" = "monorepo" ]; then
            echo "Monorepo detected — verifying each substack..."
            echo "$STACK_JSON" | python3 -c "
          import json, subprocess, sys, os

          data = json.load(sys.stdin)
          substacks = data.get('substacks', [])
          failed = False

          for s in substacks:
              subdir = s['dir']
              print(f\"\n=== {s['name']} ({s['stack']}) ===\")

              # Install dependencies
              if s['stack'] in ('typescript', 'javascript', 'nextjs'):
                  subprocess.run('npm ci || npm install', shell=True, cwd=subdir)
              elif s['stack'] == 'python':
                  if os.path.exists(os.path.join(subdir, 'uv.lock')):
                      subprocess.run('uv sync', shell=True, cwd=subdir)
                  else:
                      subprocess.run('pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true', shell=True, cwd=subdir)

              for cmd_name in ('build', 'test', 'lint'):
                  cmd = s.get(cmd_name, '')
                  if cmd:
                      print(f'Running {cmd_name}: {cmd}')
                      result = subprocess.run(cmd, shell=True, cwd=subdir)
                      if result.returncode != 0 and cmd_name != 'lint':
                          failed = True

          sys.exit(1 if failed else 0)
          "
          else
            # Single-stack path
            BUILD_CMD=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
            TEST_CMD=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['test'])")
            LINT_CMD=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['lint'])")

            case "$STACK" in
              typescript|javascript|nextjs) npm ci || npm install ;;
              python) pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true ;;
              rust) ;;
            esac

            [ -n "$BUILD_CMD" ] && echo "Running build: $BUILD_CMD" && eval "$BUILD_CMD"
            [ -n "$TEST_CMD" ] && echo "Running tests: $TEST_CMD" && eval "$TEST_CMD"
            [ -n "$LINT_CMD" ] && echo "Running lint: $LINT_CMD" && eval "$LINT_CMD" || true
          fi
